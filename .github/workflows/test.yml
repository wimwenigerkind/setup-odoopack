name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          version: latest
      - name: odoopack is on the PATH and reports the installed version
        env:
          TAG: ${{ steps.setup.outputs.version }}
          BIN: ${{ steps.setup.outputs.odoopack-path }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          test -f "$BIN"
          out=$(odoopack --version)
          echo "$out"
          case "$out" in
            *"${TAG#v}"*) ;;
            *) echo "::error::expected version ${TAG#v} in '$out'"; exit 1 ;;
          esac

  auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # A quote and a backslash would have broken the JSON built by string concatenation.
      - uses: ./
        with:
          registry-url: https://registry.example.com/
          token: 'fake"to\ken'
      - name: ODOOPACK_AUTH holds the token for the bare host and for scheme://host
        run: |
          set -euo pipefail
          jq -e --arg t 'fake"to\ken' '
            keys == ["bearer"]
            and (.bearer | length) == 2
            and .bearer["registry.example.com"] == $t
            and .bearer["https://registry.example.com"] == $t
          ' <<<"$ODOOPACK_AUTH"

  workload-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Stands in for the registry: it checks the exchange request and the audience of the real GitHub token.
      - name: Start a fake registry
        run: |
          cat > "$RUNNER_TEMP/registry.py" <<'EOF'
          import base64, json, sys
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import parse_qs

          class Registry(BaseHTTPRequestHandler):
              def do_POST(self):
                  form = {k: v[0] for k, v in parse_qs(self.rfile.read(int(self.headers["Content-Length"])).decode()).items()}
                  payload = form.get("subject_token", "..").split(".")[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
                  ok = (
                      self.path == "/oauth/token"
                      and form.get("grant_type") == "urn:ietf:params:oauth:grant-type:token-exchange"
                      and form.get("subject_token_type") == "urn:ietf:params:oauth:token-type:jwt"
                      and form.get("workload_identity_provider") == "github"
                      and form.get("service_account") == "acme-ci"
                      and claims.get("aud") in ("http://localhost:8787", ["http://localhost:8787"])
                  )
                  body = {"access_token": "odp_wlt_fake", "token_type": "Bearer", "expires_in": 900} if ok else {"error": "invalid_request"}
                  self.send_response(200 if ok else 400)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps(body).encode())

          HTTPServer(("127.0.0.1", 8787), Registry).serve_forever()
          EOF
          python3 "$RUNNER_TEMP/registry.py" &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://localhost:8787 && break; sleep 0.5; done
      # The trailing slash must not reach the audience.
      - uses: ./
        with:
          registry-url: http://localhost:8787/
          workload-identity-provider: github
          service-account: acme-ci
      - name: ODOOPACK_AUTH holds the exchanged token
        run: |
          set -euo pipefail
          jq -e '.bearer["localhost:8787"] == "odp_wlt_fake" and .bearer["http://localhost:8787"] == "odp_wlt_fake"' <<<"$ODOOPACK_AUTH"

  auth-rejects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: newline
        continue-on-error: true
        uses: ./
        with:
          registry-url: https://registry.example.com
          token: "fake\ntoken"
      - id: plain-http
        continue-on-error: true
        uses: ./
        with:
          registry-url: http://registry.example.com
          token: faketoken
      - id: token-and-workload-identity
        continue-on-error: true
        uses: ./
        with:
          registry-url: https://registry.example.com
          token: faketoken
          workload-identity-provider: github
          service-account: acme-ci
      - id: provider-without-service-account
        continue-on-error: true
        uses: ./
        with:
          registry-url: https://registry.example.com
          workload-identity-provider: github
      # This job has no id-token permission, so there is no OIDC token to exchange.
      - id: no-oidc
        continue-on-error: true
        uses: ./
        with:
          registry-url: https://registry.example.com
          workload-identity-provider: github
          service-account: acme-ci
      - name: all were refused and nothing was exported
        env:
          OUTCOMES: >-
            ${{ steps.newline.outcome }} ${{ steps.plain-http.outcome }}
            ${{ steps.token-and-workload-identity.outcome }} ${{ steps.provider-without-service-account.outcome }}
            ${{ steps.no-oidc.outcome }}
        run: |
          set -euo pipefail
          for outcome in $OUTCOMES; do test "$outcome" = failure; done
          test "$(wc -w <<<"$OUTCOMES")" -eq 5
          test -z "${ODOOPACK_AUTH:-}"
