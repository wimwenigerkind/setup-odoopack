name: 'Setup odoopack'
description: 'Install the odoopack CLI and optionally configure private registry authentication.'
author: 'Wim Wenigerkind'
branding:
  icon: 'package'
  color: 'purple'

inputs:
  version:
    description: 'odoopack release to install: a tag like "0.1.0" or "v0.1.0", or "latest".'
    required: false
    default: 'latest'
  token:
    description: 'API token for a private odoopack registry. When set, registry-url is required.'
    required: false
    default: ''
  registry-url:
    description: 'Base URL of the registry the token authenticates against (e.g. https://registry.example.com).'
    required: false
    default: ''
  workload-identity-provider:
    description: 'Name of a workload identity provider configured in the registry. With service-account, exchanges the job''s OIDC token for a short-lived registry token instead of using token.'
    required: false
    default: ''
  service-account:
    description: 'Name of the registry service account bound to the job through workload-identity-provider.'
    required: false
    default: ''

outputs:
  version:
    description: 'The release tag that was installed.'
    value: ${{ steps.install.outputs.version }}
  odoopack-path:
    description: 'Absolute path to the installed odoopack binary.'
    value: ${{ steps.install.outputs.odoopack-path }}

runs:
  using: 'composite'
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        REPO="wimwenigerkind/odoopack"
        version="${INPUT_VERSION:-latest}"

        case "$RUNNER_OS" in
          Linux) os="Linux" ;;
          macOS) os="Darwin" ;;
          Windows) os="Windows" ;;
          *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch="x86_64" ;;
          ARM64) arch="arm64" ;;
          X86) arch="i386" ;;
          *) echo "::error::unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac
        if [ "$RUNNER_OS" = "Windows" ]; then ext="zip"; bin="odoopack.exe"; else ext="tar.gz"; bin="odoopack"; fi
        asset="odoopack_${os}_${arch}.${ext}"

        if [ "$version" = "latest" ]; then
          loc=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/${REPO}/releases/latest")
          candidates="${loc##*/}"
          if [ "$candidates" = "releases" ] || [ "$candidates" = "latest" ]; then
            echo "::error::no releases found for ${REPO}"; exit 1
          fi
        else
          case "$version" in
            v*) candidates="$version ${version#v}" ;;
            *)  candidates="$version v$version" ;;
          esac
        fi

        dl="$(mktemp -d)"
        tag=""
        for c in $candidates; do
          base="https://github.com/${REPO}/releases/download/${c}"
          if curl -fsSL -o "${dl}/${asset}" "${base}/${asset}"; then tag="$c"; break; fi
        done
        if [ -z "$tag" ]; then
          echo "::error::could not download ${asset} for version '${version}' from ${REPO}"; exit 1
        fi
        base="https://github.com/${REPO}/releases/download/${tag}"

        checksums="odoopack_${tag#v}_checksums.txt"
        if ! curl -fsSL -o "${dl}/checksums.txt" "${base}/${checksums}"; then
          echo "::error::could not download ${checksums} for ${tag}; refusing to install an unverified binary"; exit 1
        fi
        # awk instead of grep: grep exits 1 when nothing matches, which ends the step silently under pipefail.
        expected=$(awk -v a="$asset" '$2 == a { print $1; exit }' "${dl}/checksums.txt")
        if [ -z "$expected" ]; then
          echo "::error::${checksums} has no entry for ${asset}; refusing to install an unverified binary"; exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then sumcmd="sha256sum"; else sumcmd="shasum -a 256"; fi
        actual=$($sumcmd "${dl}/${asset}" | awk '{print $1}')
        if [ "$expected" != "$actual" ]; then
          echo "::error::checksum mismatch for ${asset} (expected ${expected}, got ${actual})"; exit 1
        fi
        echo "checksum verified for ${asset}"

        install_dir="${RUNNER_TEMP}/odoopack-cli"
        mkdir -p "$install_dir"
        case "$ext" in
          tar.gz) tar -xzf "${dl}/${asset}" -C "$install_dir" ;;
          zip) unzip -o "${dl}/${asset}" -d "$install_dir" >/dev/null ;;
        esac
        if [ ! -f "${install_dir}/${bin}" ]; then
          echo "::error::binary ${bin} not found in archive ${asset}"; exit 1
        fi
        chmod +x "${install_dir}/${bin}" 2>/dev/null || true

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=${tag}" >> "$GITHUB_OUTPUT"
        echo "odoopack-path=${install_dir}/${bin}" >> "$GITHUB_OUTPUT"
        echo "installed odoopack ${tag} to ${install_dir}/${bin}"

    - id: auth
      if: inputs.token != '' || inputs.workload-identity-provider != '' || inputs.service-account != ''
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REGISTRY_URL: ${{ inputs.registry-url }}
        INPUT_PROVIDER: ${{ inputs.workload-identity-provider }}
        INPUT_SERVICE_ACCOUNT: ${{ inputs.service-account }}
      run: |
        set -euo pipefail
        # Checked before add-mask: a mask only covers a single line, so a multi-line token would leak into the log.
        case "${INPUT_TOKEN}${INPUT_REGISTRY_URL}${INPUT_PROVIDER}${INPUT_SERVICE_ACCOUNT}" in
          *$'\n'* | *$'\r'*)
            echo "::error::token, registry-url, workload-identity-provider and service-account must not contain a newline or carriage return"; exit 1 ;;
        esac
        if [ -n "${INPUT_TOKEN}" ]; then
          echo "::add-mask::${INPUT_TOKEN}"
          if [ -n "${INPUT_PROVIDER}${INPUT_SERVICE_ACCOUNT}" ]; then
            echo "::error::set either token or workload-identity-provider and service-account, not both"; exit 1
          fi
        elif [ -z "${INPUT_PROVIDER}" ] || [ -z "${INPUT_SERVICE_ACCOUNT}" ]; then
          echo "::error::workload identity needs both workload-identity-provider and service-account"; exit 1
        fi
        if [ -z "${INPUT_REGISTRY_URL}" ]; then
          echo "::error::registry-url is empty: set it so the token can be scoped to that host"
          exit 1
        fi
        url="${INPUT_REGISTRY_URL}"
        scheme="${url%%://*}"
        rest="${url#*://}"
        host="${rest%%/*}"
        if [ "$scheme" = "$url" ]; then
          scheme="https"
          host="${url%%/*}"
        fi
        if [ -z "$host" ]; then
          echo "::error::registry-url '${url}' has no host"; exit 1
        fi
        # Mirrors the CLI, which sends a token over plain http only to a loopback host.
        hostname="${host%:*}"
        case "$host" in \[*) hostname="${host%%]*}]" ;; esac
        case "$scheme" in
          https) ;;
          http)
            case "$hostname" in
              localhost | 127.* | "[::1]") ;;
              *) echo "::error::registry-url '${url}' uses http; odoopack sends a token only over https (plain http is allowed for localhost only)"; exit 1 ;;
            esac ;;
          *) echo "::error::registry-url '${url}' must use https"; exit 1 ;;
        esac

        if [ -z "${INPUT_TOKEN}" ]; then
          # GitHub sets these with permissions id-token: write, Forgejo with enable-openid-connect: true.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::no OIDC token available: grant 'permissions: id-token: write' on GitHub or set 'enable-openid-connect: true' on the Forgejo job"
            exit 1
          fi
          # The registry expects its base URL without a trailing slash as the audience.
          base="${scheme}://${rest%/}"
          if ! response=$(curl -sS --fail-with-body -G \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${base}" "${ACTIONS_ID_TOKEN_REQUEST_URL}"); then
            echo "::error::requesting the OIDC token of the job failed: ${response}"; exit 1
          fi
          id_token=$(jq -r '.value // empty' <<<"$response")
          id_token="${id_token%$'\r'}"
          if [ -z "$id_token" ]; then
            echo "::error::the CI returned no OIDC token"; exit 1
          fi
          echo "::add-mask::${id_token}"
          if ! response=$(curl -sS --fail-with-body -X POST "${base}/oauth/token" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            --data-urlencode "subject_token=${id_token}" \
            --data-urlencode "workload_identity_provider=${INPUT_PROVIDER}" \
            --data-urlencode "service_account=${INPUT_SERVICE_ACCOUNT}"); then
            echo "::error::the registry refused the token exchange for service account '${INPUT_SERVICE_ACCOUNT}' (${response}); its log names the reason"
            exit 1
          fi
          INPUT_TOKEN=$(jq -r '.access_token // empty' <<<"$response")
          INPUT_TOKEN="${INPUT_TOKEN%$'\r'}"
          if [ -z "$INPUT_TOKEN" ]; then
            echo "::error::the registry returned no access token"; exit 1
          fi
          echo "::add-mask::${INPUT_TOKEN}"
          echo "exchanged the OIDC token of the job for a registry token of '${INPUT_SERVICE_ACCOUNT}', valid $(jq -r '.expires_in' <<<"$response")s"
        fi

        auth=$(jq -cn --arg host "$host" --arg url "${scheme}://${host}" --arg token "$INPUT_TOKEN" \
          '{bearer: {($host): $token, ($url): $token}}')
        # Strip a carriage return in case jq on Windows writes CRLF line endings.
        auth="${auth%$'\r'}"
        {
          echo "ODOOPACK_AUTH<<ODOOPACK_AUTH_EOF"
          echo "$auth"
          echo "ODOOPACK_AUTH_EOF"
        } >> "$GITHUB_ENV"
        echo "configured ODOOPACK_AUTH for ${scheme}://${host}"
